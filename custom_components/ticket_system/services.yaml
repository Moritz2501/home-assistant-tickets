create:
  fields:
    title:
      required: true
      example: "Heizung im Wohnzimmer defekt"
      selector:
        text:
    description:
      example: "Seit heute Morgen wird die Heizung nicht mehr warm."
      selector:
        text:
          multiline: true
    priority:
      example: "high"
      default: "medium"
      selector:
        select:
          options:
            - value: "low"
              label: "Niedrig"
            - value: "medium"
              label: "Mittel"
            - value: "high"
              label: "Hoch"
            - value: "critical"
              label: "Kritisch"
    status:
      default: "open"
      selector:
        select:
          options:
            - value: "open"
              label: "Offen"
            - value: "in_progress"
              label: "In Bearbeitung"
            - value: "closed"
              label: "Abgeschlossen"
    author:
      example: "Max Mustermann"
      selector:
        text:

